      function playSoftChime(kind = 'phase') {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        try {
          const ctx = new AudioCtx();
          const now = ctx.currentTime;
          const freqs = kind === 'complete' ? [528, 660, 792] : [528, 660];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + idx * 0.11);
            gain.gain.setValueAtTime(0.0001, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.06, now + idx * 0.11 + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.11 + 1.15);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 1.2);
          });
          setTimeout(() => {
            if (ctx.state !== 'closed') ctx.close().catch(() => {});
          }, 1800);
        } catch (e) {}

            fisica: { done: 0, total: 0 },

          tasks.forEach((task) => {

          e.preventDefault();
          const cleanTitle = newTitle.trim();
          if (!cleanTitle) return;

                    <span className="text-slate-500 block">Física</span>
                    <span className="font-mono font-medium tabular-nums text-slate-800">{categoryCounts.fisica.done}/{categoryCounts.fisica.total}</span>

                    <span className="text-slate-500 block">Digital</span>

            </div>

            <div className="bg-[#FFFDF9] text-slate-900 rounded-2xl border border-amber-200/60 divide-y divide-amber-100/80 overflow-hidden">
              {filteredTasks.map((task) => {
                const isChecked = completedTaskIds.includes(task.id);
                const isExpanded = expandedInsightId === task.id;
                return (
                  <div key={task.id} className={isChecked ? 'bg-emerald-50/45' : 'bg-[#FFFDF9] hover:bg-[#FDF7F2]'}>
                    <div className="flex items-start gap-3 sm:gap-4 p-4 sm:p-5">
                      <button

                <p className="text-xs sm:text-sm text-slate-600">¿Hay un cajón específico, carpeta en la nube o pendiente concreto que quieras soltar hoy?</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-12 gap-3">

                    <option value="fisica">Purga Física</option>
                    <option value="digital">Detox Digital</option>
                    <option value="matutino">Orden Matutino</option>
                  </select>
                </div>
                <div className="md:col-span-4">
                  <input type="text" value={newTitle} onChange={(e) => setNewTitle(e.target.value)} placeholder="Ej. Vaciar carpeta de escritorio 2025" className="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 placeholder:text-slate-400" />
                </div>
                <div className="md:col-span-3">
                  <input type="text" value={newDetail} onChange={(e) => setNewDetail(e.target.value)} placeholder="Detalle breve (opcional)" className="w-full min-h-[44px] px-3.5 py-2.5 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 placeholder:text-slate-400" />
                </div>
                <div className="md:col-span-2">
                  <button type="submit" disabled={!newTitle.trim()} className="w-full min-h-[44px] px-4 py-2.5 rounded-xl bg-[#15803D] hover:bg-[#166534] disabled:bg-slate-300 text-white font-medium text-sm inline-flex items-center justify-center gap-1.5 cursor-pointer">
                    <IconPlus />
                    <span>Agregar</span>
                  </button>
                </div>
              </div>
            </form>

            <div className="pt-4 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
              <button type="button" onClick={() => onNavigate(1)} className="min-h-[44px] px-5 py-2.5 rounded-xl border border-amber-200/35 bg-white/10 hover:bg-white/20 text-[#FFFDF9] text-sm font-medium cursor-pointer">
                Volver a Vacío Fértil
              </button>
              <button type="button" onClick={() => onNavigate(3)} className="min-h-[48px] px-6 py-3 rounded-xl bg-[#FFFDF9] hover:bg-amber-50 text-[#8B1520] text-sm font-semibold inline-flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                <span>Continuar a Estándares de Bienestar</span>
                <IconArrowRight />
              </button>
            </div>
          </section>
        );
      };

      /* ---------- Screen 3: Non-Negotiables ---------- */
      const ScreenNonNegotiables = ({ items, onUpdateItem, onNavigate }) => {
        const [activePresetTarget, setActivePresetTarget] = useState(1);
        const [copiedPact, setCopiedPact] = useState(false);

        const sealedCount = items.filter((item) => item.sealed).length;
        const allSealed = sealedCount === 3;

        const applyPreset = (presetIndex) => {
          const preset = NON_NEGOTIABLE_PRESETS[presetIndex];
          if (!preset) return;
          onUpdateItem(activePresetTarget, {
            pillar: preset.pillar,
            statement: preset.statement,
            trigger: preset.trigger,
            boundary: preset.boundary,
            sealed: false,
          });
        };

        const handleCopyPact = async () => {
          const lines = [
            'MIS 3 ESTÁNDARES INQUEBRANTABLES — EL UMBRAL DEL RENACER',
            '',
            ...items.map((item, idx) => `${idx + 1}. [${item.pillar}] ${item.statement.trim() || '(Pendiente)'}\n   Disparador: ${item.trigger.trim() || 'Por definir'}\n   Línea de protección: ${item.boundary.trim() || 'Por definir'}`),
          ].join('\n');
          try {
            await navigator.clipboard.writeText(lines);
            setCopiedPact(true);
            setTimeout(() => setCopiedPact(false), 2500);
          } catch (e) {}
        };

        return (
          <section aria-labelledby="standards-heading" className="space-y-8 sm:space-y-10">
            <div className="flex flex-col lg:flex-row lg:items-end justify-between gap-6">
              <div className="space-y-3 max-w-2xl">
                <div className="flex items-center gap-2 text-xs font-medium text-amber-200">
                  <span>03. Estándares de Bienestar</span>
                  <span aria-hidden="true">·</span>
                  <span>Tres Compromisos Inquebrantables</span>
                </div>
                <h1 id="standards-heading" className="font-editorial text-3xl sm:text-4xl lg:text-5xl font-semibold text-[#FFFDF9] leading-tight" style={{ textWrap: 'balance' }}>
                  Diseña tus 3 &ldquo;Non-Negotiables&rdquo; para el año entrante
                </h1>
                <p className="text-sm sm:text-base text-red-50/90 leading-relaxed">
                  Las metas dependen de la motivación; los estándares gobiernan tu identidad cotidiana. Redacta en presente afirmativo los 3 pactos de autocuidado que protegerás sin excusas.
                </p>
              </div>
              <div className="p-4 sm:p-5 rounded-2xl bg-[#FFFDF9] border border-amber-200/60 flex items-center gap-4 shrink-0 text-slate-900">
                <div className="w-11 h-11 rounded-xl bg-amber-50 border border-amber-200/80 flex items-center justify-center text-[#D97706]">
                  <IconShield />
                </div>
                <div>
                  <p className="text-xs text-slate-500">Compromisos sellados</p>
                  <p className="font-mono text-2xl font-semibold tabular-nums text-slate-900">{sealedCount} / 3</p>
                </div>
              </div>
            </div>

            <div className="p-5 rounded-2xl bg-[#FFFDF9] border border-amber-200/60 space-y-3 text-slate-900">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <p className="text-xs font-medium text-slate-700">
                  Plantillas de inspiración rápida — aplica una base al Compromiso #{activePresetTarget}:
                </p>
                <div className="flex items-center gap-1.5">
                  {[1, 2, 3].map((num) => (
                    <button
                      key={num}
                      type="button"
                      onClick={() => setActivePresetTarget(num)}
                      className={`min-h-[36px] px-3 py-1 rounded-lg text-xs font-mono font-medium cursor-pointer ${activePresetTarget === num ? 'bg-[#991B1B] text-white' : 'bg-[#FDF7F2] text-slate-600 border border-amber-200/70 hover:border-red-300'}`}
                    >
                      #{num}
                    </button>
                  ))}
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                {NON_NEGOTIABLE_PRESETS.map((preset, idx) => (
                  <button
                    key={preset.label}
                    type="button"
                    onClick={() => applyPreset(idx)}
                    className="min-h-[40px] px-3.5 py-2 rounded-xl bg-[#FDF7F2] hover:bg-emerald-50 border border-amber-200/70 hover:border-[#15803D]/40 text-xs sm:text-sm font-medium text-slate-700 hover:text-[#15803D] cursor-pointer whitespace-nowrap shrink-0"
                  >
                    + {preset.label}
                  </button>
                ))}
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              {items.map((item, idx) => {
                const canSeal = item.statement.trim().length >= 8;
                return (
                  <article key={item.id} className={`rounded-2xl border p-6 flex flex-col justify-between transition-colors text-slate-900 ${item.sealed ? 'bg-[#FFFBEB] border-[#D97706]' : 'bg-[#FFFDF9] border-amber-200/60'}`}>
                    <div className="space-y-5">
                      <div className="flex items-center justify-between gap-2 pb-3 border-b border-amber-100">
                        <span className="font-mono text-xs font-semibold tabular-nums text-[#991B1B]">Estándar 0{idx + 1}</span>
                        <span className={`text-xs font-medium ${item.sealed ? 'text-[#15803D]' : 'text-slate-500'}`}>{item.sealed ? 'Sellado para el ciclo' : 'En redacción'}</span>
                      </div>

                      <div className="space-y-1.5">
                        <label className="block text-xs font-medium text-slate-600">Pilar de bienestar</label>
                        <select value={item.pillar} disabled={item.sealed} onChange={(e) => onUpdateItem(item.id, { pillar: e.target.value })} className="w-full min-h-[44px] px-3 py-2 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 disabled:opacity-75">
                          {WELLNESS_PILLARS.map((p) => <option key={p} value={p}>{p}</option>)}
                        </select>
                      </div>

                      <div className="space-y-1.5">
                        <label className="block text-xs font-medium text-slate-600">Mi compromiso en presente afirmativo</label>
                        <textarea rows={3} disabled={item.sealed} value={item.statement} onChange={(e) => onUpdateItem(item.id, { statement: e.target.value })} placeholder="Ej. Protejo mis primeros 25 minutos del día en silencio antes de abrir pantallas." className="w-full p-3 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 placeholder:text-slate-400 leading-relaxed resize-none disabled:opacity-80" />
                      </div>

                      <div className="space-y-1.5">
                        <label className="block text-xs font-medium text-slate-600">Disparador diario (cuándo ocurre)</label>
                        <input type="text" disabled={item.sealed} value={item.trigger} onChange={(e) => onUpdateItem(item.id, { trigger: e.target.value })} placeholder="Ej. Al despertar y beber un vaso de agua" className="w-full min-h-[44px] px-3 py-2 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 placeholder:text-slate-400 disabled:opacity-80" />
                      </div>

                      <div className="space-y-1.5">
                        <label className="block text-xs font-medium text-slate-600">Línea de protección (a qué digo NO)</label>
                        <input type="text" disabled={item.sealed} value={item.boundary} onChange={(e) => onUpdateItem(item.id, { boundary: e.target.value })} placeholder="Ej. No reviso mensajes antes de las 8:00" className="w-full min-h-[44px] px-3 py-2 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 placeholder:text-slate-400 disabled:opacity-80" />
                      </div>
                    </div>

                    <div className="pt-5 mt-5 border-t border-amber-100">
                      <button
                        type="button"
                        disabled={!item.sealed && !canSeal}
                        onClick={() => onUpdateItem(item.id, { sealed: !item.sealed })}
                        className={`w-full min-h-[46px] px-4 py-2.5 rounded-xl text-sm font-medium inline-flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50 ${item.sealed ? 'bg-white border border-amber-300 text-slate-700 hover:bg-amber-50' : 'bg-[#D97706] hover:bg-[#B45309] text-white'}`}
                      >
                        {item.sealed ? (<><IconEdit /><span>Editar Estándar</span></>) : (<><IconLock /><span>Fijar Compromiso</span></>)}
                      </button>
                    </div>
                  </article>
                );
              })}
            </div>

            <div className={`p-6 rounded-2xl border flex flex-col md:flex-row md:items-center justify-between gap-4 text-slate-900 ${allSealed ? 'bg-gradient-to-r from-[#FFFBEB] via-[#FFFDF9] to-emerald-50/70 border-[#D97706]' : 'bg-[#FFFDF9] border-amber-200/60'}`}>
              <div className="space-y-1">
                <p className="font-editorial text-2xl font-semibold text-slate-900">
                  {allSealed ? 'Tus 3 Estándares Inquebrantables están sellados' : 'Manifiesto de Estándares en construcción'}
                </p>
                <p className="text-sm text-slate-600">
                  {allSealed ? 'Ahora llevaremos esta decisión al cuerpo mediante la instalación somática de tu Ancla de Poder PNL.' : 'Sella tus 3 estándares para consolidar tu pacto antes de pasar al Ancla de Poder.'}
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-3 shrink-0">
                <button type="button" onClick={handleCopyPact} className="min-h-[44px] px-4 py-2.5 rounded-xl border border-amber-200/80 bg-white hover:bg-amber-50 text-slate-700 text-sm font-medium inline-flex items-center gap-2 cursor-pointer whitespace-nowrap">
                  {copiedPact ? (<><IconCheck className="w-4 h-4 text-[#15803D]" /><span>Pacto copiado</span></>) : (<><IconCopy /><span>Copiar mis 3 Estándares</span></>)}
                </button>
                <button type="button" onClick={() => onNavigate(4)} className="min-h-[48px] px-6 py-3 rounded-xl bg-[#15803D] hover:bg-[#166534] text-white text-sm font-medium inline-flex items-center justify-center gap-2 shadow-sm cursor-pointer whitespace-nowrap">
                  <span>Instalar Ancla de Poder PNL</span>
                  <IconArrowRight />
                </button>
              </div>
            </div>
          </section>
        );
      };

      /* ---------- Screen 4: Ancla de Poder PNL ---------- */
      const ScreenAnclaPNL = ({
        anchorPoint,
        anchorPhrase,
        anchorDuration,
        onChangePoint,
        onChangePhrase,
        onChangeDuration,
        onLogCompletion,
        onOpenBitacora,
      }) => {
        const [elapsedSec, setElapsedSec] = useState(0);
        const [isRunning, setIsRunning] = useState(false);
        const [isCompleted, setIsCompleted] = useState(false);
        const [intensity, setIntensity] = useState(8);
        const [logSaved, setLogSaved] = useState(false);
        const [isVoicePlaying, setIsVoicePlaying] = useState(false);
        const [showScript, setShowScript] = useState(false);
        const [voiceError, setVoiceError] = useState(null);
        const prevStepRef = useRef(1);

        const selectedPointObj = useMemo(
          () => ANCHOR_POINTS.find((p) => p.id === anchorPoint) || ANCHOR_POINTS[0],
          [anchorPoint]
        );
        const progressRatio = Math.min(1, elapsedSec / anchorDuration);
        const currentPhase = useMemo(() => {
          const found = ANCHOR_PHASES.find((phase) => progressRatio >= phase.ratioStart && progressRatio < phase.ratioEnd);
          return found || ANCHOR_PHASES[ANCHOR_PHASES.length - 1];
        }, [progressRatio]);

        const cleanPhrase = anchorPhrase.trim() || 'Presencia Inquebrantable';

        const mexicanScript = useMemo(() => {
          const pointAction =
            anchorPoint === 'pecho'
              ? 'apoya tu mano abierta y cálida justo sobre el centro de tu pecho'
              : anchorPoint === 'muneca'
              ? 'presiona suavemente con tres dedos la cara interna de tu muñeca donde sientes el pulso'
              : 'une con firmeza serena la yema de tu pulgar y tu índice de tu mano dominante';

          return `Respira profundo por la nariz... y suelta el aire despacio. Tu ancla "${cleanPhrase}" ya está lista para usar. Vamos a activarla juntos en este momento. Lleva tu atención a tu ${selectedPointObj.shortLabel.toLowerCase()}, y ${pointAction} con una presión firme pero tranquila. Sostén ese contacto... uno... dos... tres. Siente cómo una certeza serena y estable despierta desde tu pecho hacia tus hombros. Repite en silencio contigo mismo: "${cleanPhrase}". Ahora suelta suavemente el contacto, toma una respiración natural y guarda la tranquilidad de saber que este estado de poder te acompaña hoy y en todo tu nuevo ciclo.`;
        }, [anchorPoint, cleanPhrase, selectedPointObj.shortLabel]);

        const getPhaseScript = (stepNum) => {
          const pointAction =
            anchorPoint === 'pecho'
              ? 'apoya tu mano abierta y cálida justo sobre el centro de tu pecho'
              : anchorPoint === 'muneca'
              ? 'presiona suavemente con tres dedos la cara interna de tu muñeca donde sientes el pulso'
              : 'une con firmeza serena la yema de tu pulgar y tu índice de tu mano dominante';
          if (stepNum === 1) {
            return 'Paso uno. Respira profundo en cuatro tiempos, sostén dos segundos y exhala largo en seis. Suelta tus hombros, relaja la mandíbula y siente ambos pies firmes en la tierra.';
          }
          if (stepNum === 2) {
            return 'Paso dos. Trae a tu mente un recuerdo real en el que te sentiste completamente capaz, sereno y con claridad. Deja que esa fuerza llene todo tu cuerpo.';
          }
          if (stepNum === 3) {
            return `Paso tres. En el punto más alto de esa emoción, ${pointAction} con firmeza constante y repite por dentro: "${cleanPhrase}".`;
          }
          return `Paso cuatro. Suelta el contacto físico, toma una respiración neutra y vuelve a tocar tu ${selectedPointObj.shortLabel.toLowerCase()} durante tres segundos para verificar tu ancla.`;
        };

        const stopVoiceGuide = () => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
          }
          setIsVoicePlaying(false);
        };

        useEffect(() => {
          return () => stopVoiceGuide();
        }, []);

        const pickMexicanMaleVoice = () => {
          if (!('speechSynthesis' in window)) return null;
          const voices = window.speechSynthesis.getVoices() || [];
          const mxVoices = voices.filter((v) => v.lang && v.lang.toLowerCase().includes('es-mx'));
          const maleKeywords = /(raul|jorge|carlos|diego|mateo|pablo|alonso|dario|andres|male|hombre)/i;
          return (
            mxVoices.find((v) => maleKeywords.test(v.name)) ||
            mxVoices[0] ||
            voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('es') && maleKeywords.test(v.name)) ||
            voices.find((v) => v.lang && v.lang.toLowerCase().startsWith('es')) ||
            null
          );
        };

        const speakText = (textToSpeak, trackState = false) => {
          if (!('speechSynthesis' in window)) return;
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(textToSpeak);
          const chosenVoice = pickMexicanMaleVoice();
          if (chosenVoice) utterance.voice = chosenVoice;
          utterance.lang = 'es-MX';
          utterance.rate = 0.88;
          utterance.pitch = 0.84;
          if (trackState) {
            utterance.onend = () => setIsVoicePlaying(false);
            utterance.onerror = () => {
              setIsVoicePlaying(false);
              setVoiceError('No se pudo reproducir la voz del navegador.');
            };
            setIsVoicePlaying(true);
          }
          window.speechSynthesis.speak(utterance);
        };

        const handleToggleVoiceGuide = () => {
          setVoiceError(null);
          if (!('speechSynthesis' in window)) {
            setVoiceError('Tu navegador no soporta síntesis de voz nativa.');
            return;
          }
          if (isVoicePlaying) {
            stopVoiceGuide();
            return;
          }
          speakText(mexicanScript, true);
        };

        useEffect(() => {
          if (!isRunning) return;
          const timerId = window.setInterval(() => {
            setElapsedSec((prev) => {
              const next = prev + 1;
              if (next >= anchorDuration) {
                setIsRunning(false);
                setIsCompleted(true);
                playSoftChime('complete');
                return anchorDuration;
              }
              return next;
            });
          }, 1000);
          return () => window.clearInterval(timerId);
        }, [isRunning, anchorDuration]);

        useEffect(() => {
          if (isRunning && currentPhase.step !== prevStepRef.current) {
            prevStepRef.current = currentPhase.step;
            playSoftChime('phase');
            speakText(getPhaseScript(currentPhase.step), false);
          }
        }, [currentPhase.step, isRunning]);

        const remainingSec = Math.max(0, anchorDuration - elapsedSec);
        const minutesStr = String(Math.floor(remainingSec / 60)).padStart(2, '0');
        const secondsStr = String(remainingSec % 60).padStart(2, '0');

        const handleStartOrToggle = () => {
          if (isCompleted) {
            stopVoiceGuide();
            setElapsedSec(0);
            setIsCompleted(false);
            setLogSaved(false);
            prevStepRef.current = 1;
            setIsRunning(true);
            playSoftChime('phase');
            speakText(getPhaseScript(1), false);
            return;
          }
          if (!isRunning && elapsedSec === 0) {
            playSoftChime('phase');
            speakText(getPhaseScript(1), false);
            setIsRunning(true);
            return;
          }
          if (isRunning) {
            stopVoiceGuide();
            setIsRunning(false);
          } else {
            setIsRunning(true);
          }
        };

        const handleReset = () => {
          stopVoiceGuide();
          setIsRunning(false);
          setElapsedSec(0);
          setIsCompleted(false);
          setLogSaved(false);
          prevStepRef.current = 1;
        };

        const handleJumpToReadyAnchor = () => {
          stopVoiceGuide();
          setIsRunning(false);
          setElapsedSec(anchorDuration);
          setIsCompleted(true);
          setLogSaved(false);
        };

        const handleSaveSession = () => {
          onLogCompletion({
            completedAt: new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }),
            point: anchorPoint,
            phrase: cleanPhrase,
            durationSec: anchorDuration,
            intensity,
          });
          setLogSaved(true);
        };

        const ringCircumference = 2 * Math.PI * 104;
        const ringOffset = ringCircumference * (1 - progressRatio);
        const isFijacionPhase = currentPhase.step === 3;

        return (
          <section aria-labelledby="ancla-heading" className="space-y-8 sm:space-y-10">
            <div className="space-y-3 max-w-2xl">
              <div className="flex items-center gap-2 text-xs font-medium text-amber-200">
                <span>04. Ancla de Poder PNL</span>
                <span aria-hidden="true">·</span>
                <span>Instalación Cinestésica Guiada</span>
              </div>
              <h1 id="ancla-heading" className="font-editorial text-3xl sm:text-4xl lg:text-5xl font-semibold text-[#FFFDF9] leading-tight" style={{ textWrap: 'balance' }}>
                Instala tu Ancla de Poder para el Nuevo Ciclo
              </h1>
              <p className="text-sm sm:text-base text-red-50/90 leading-relaxed">
                En PNL, un ancla cinestésica conecta un estado emocional cumbre con un estímulo táctil preciso. Configura tu punto físico y pulsa Iniciar Anclaje para seguir la guía automática.
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
              <div className="lg:col-span-5 space-y-6">
                <div className="p-6 rounded-2xl bg-[#FFFDF9] border border-amber-200/60 space-y-5 text-slate-900">
                  <div className="space-y-2">
                    <label className="block text-xs font-medium text-slate-600">1. Punto de anclaje físico</label>
                    <div className="grid grid-cols-3 gap-2">
                      {ANCHOR_POINTS.map((point) => (
                        <button
                          key={point.id}
                          type="button"
                          disabled={isRunning}
                          onClick={() => onChangePoint(point.id)}
                          className={`min-h-[44px] px-2.5 py-2 rounded-xl text-xs font-medium cursor-pointer disabled:opacity-70 ${anchorPoint === point.id ? 'bg-[#991B1B] text-white' : 'bg-[#FDF7F2] text-slate-700 border border-amber-200/60 hover:bg-amber-50'}`}
                        >
                          {point.shortLabel}
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-slate-600 leading-relaxed pt-1">{selectedPointObj.instruction}</p>
                  </div>

                  <div className="space-y-2">
                    <label htmlFor="anchor-phrase-input" className="block text-xs font-medium text-slate-600">2. Palabra o estado ancla</label>
                    <input id="anchor-phrase-input" type="text" disabled={isRunning} value={anchorPhrase} onChange={(e) => onChangePhrase(e.target.value)} className="w-full min-h-[44px] px-3.5 py-2 rounded-xl bg-white border border-amber-200/80 text-sm text-slate-900 disabled:opacity-75" />
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {ANCHOR_PHRASE_PRESETS.map((preset) => (
                        <button key={preset} type="button" disabled={isRunning} onClick={() => onChangePhrase(preset)} className="min-h-[34px] px-2.5 py-1 rounded-lg bg-[#FDF7F2] hover:bg-red-50 text-xs text-slate-700 hover:text-[#991B1B] border border-amber-200/50 cursor-pointer">
                          {preset}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2">
                    <span className="block text-xs font-medium text-slate-600">3. Duración del ciclo guiado</span>
                    <div className="grid grid-cols-2 gap-2">
                      {[90, 120].map((sec) => (
                        <button
                          key={sec}
                          type="button"
                          disabled={isRunning}
                          onClick={() => {
                            onChangeDuration(sec);
                            handleReset();
                          }}
                          className={`min-h-[44px] px-3 py-2 rounded-xl text-xs font-medium font-mono tabular-nums cursor-pointer disabled:opacity-70 ${anchorDuration === sec ? 'bg-[#15803D] text-white' : 'bg-[#FDF7F2] text-slate-700 border border-amber-200/60 hover:bg-amber-50'}`}
                        >
                          {sec} segundos
                        </button>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="p-6 rounded-2xl bg-[#FFFDF9] border border-amber-200/60 space-y-3 text-slate-900">
                  <h2 className="font-editorial text-xl font-semibold text-slate-900 mb-2">Secuencia de 4 pasos</h2>
                  <ol className="space-y-2.5">
                    {ANCHOR_PHASES.map((phase) => {
                      const isCurrent = !isCompleted && currentPhase.step === phase.step;
                      const isPast = isCompleted || progressRatio >= phase.ratioEnd;
                      return (
                        <li
                          key={phase.step}
                          className={`p-3.5 rounded-xl border transition-colors ${isCurrent ? (phase.step === 3 ? 'bg-amber-50 border-[#D97706]/60' : 'bg-red-50/75 border-[#991B1B]/45') : isPast ? 'bg-emerald-50/40 border-emerald-200/70 opacity-85' : 'bg-white border-amber-100'}`}
                        >
                          <div className="flex items-center justify-between gap-2">
                            <span className="text-xs font-mono font-medium tabular-nums text-slate-500">Paso 0{phase.step}</span>
                            {isPast && <IconCheckCircle className="w-4 h-4 text-[#15803D]" />}
                          </div>
                          <p className="text-sm font-semibold text-slate-900 mt-0.5">{phase.title}</p>
                          <p className="text-xs text-slate-500 mt-0.5">{phase.breathCue}</p>
                        </li>
                      );
                    })}
                  </ol>
                </div>
              </div>

              <div className="lg:col-span-7">
                <div className={`p-6 sm:p-10 rounded-3xl border flex flex-col items-center text-center space-y-7 text-slate-900 ${isFijacionPhase && !isCompleted ? 'bg-gradient-to-b from-amber-50 via-[#FFFDF9] to-[#FDF7F2] border-[#D97706]' : 'bg-gradient-to-b from-[#FFFDF9] via-[#FFFDF9] to-[#FDF7F2] border-amber-200/70'}`}>
                  <div className="space-y-1.5">
                    <p className="text-xs font-medium tracking-wide text-[#991B1B]">
                      {isCompleted ? 'Ancla Instalada · Estado Verificado' : `Paso 0${currentPhase.step} de 04 · ${currentPhase.subtitle}`}
                    </p>
                    <h2 className="font-editorial text-2xl sm:text-3xl font-semibold text-slate-900">
                      {isCompleted ? `Ancla «${cleanPhrase}» lista para usar` : currentPhase.title}
                    </h2>
                  </div>

                  <div className="relative w-56 h-56 sm:w-64 sm:h-64 flex items-center justify-center">
                    <div className={`absolute inset-4 rounded-full ${isRunning || isVoicePlaying ? 'animate-breathe' : ''} ${isFijacionPhase && !isCompleted ? 'bg-amber-200/45' : 'bg-red-200/35'}`} aria-hidden="true" />
                    <svg className="w-full h-full -rotate-90 relative z-10" viewBox="0 0 240 240" aria-hidden="true">
                      <circle cx="120" cy="120" r="104" fill="none" stroke="#FDE68A" strokeOpacity="0.45" strokeWidth="6" />
                      <circle
                        cx="120"
                        cy="120"
                        r="104"
                        fill="none"
                        stroke={isCompleted || isFijacionPhase ? '#D97706' : '#15803D'}
                        strokeWidth="7"
                        strokeLinecap="round"
                        strokeDasharray={ringCircumference}
                        strokeDashoffset={ringOffset}
                        style={{ transition: 'stroke-dashoffset 0.7s linear' }}
                      />
                    </svg>
                    <div className="absolute inset-0 z-20 flex flex-col items-center justify-center px-6">
                      <span className="font-mono text-4xl sm:text-5xl font-semibold tabular-nums text-slate-900">{minutesStr}:{secondsStr}</span>
                      <span className="text-xs font-medium text-slate-600 mt-2 max-w-[160px]">
                        {isCompleted ? selectedPointObj.shortLabel : currentPhase.breathCue}
                      </span>
                    </div>
                  </div>

                  {!isCompleted ? (
                    <div className="max-w-lg space-y-4">
                      <p className="text-sm sm:text-base leading-relaxed text-slate-700">{currentPhase.instruction}</p>
                      {isFijacionPhase && (
                        <div className="p-4 rounded-2xl bg-amber-100/70 border border-amber-300/70 text-sm text-amber-950 font-medium">
                          Presiona ahora tu <span className="underline decoration-[#D97706]">{selectedPointObj.label.toLowerCase()}</span> y repite mentalmente: &ldquo;{cleanPhrase}&rdquo;
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="w-full max-w-lg space-y-5 text-left">
                      <div className="p-5 sm:p-6 rounded-2xl bg-gradient-to-br from-[#FDF7F2] via-white to-amber-50/70 border border-[#991B1B]/25 space-y-4">
                        <div>
                          <p className="text-xs font-medium text-[#991B1B]">Guía Auditiva · Voz de Hombre Mexicano</p>
                          <h3 className="font-editorial text-xl font-semibold text-slate-900 mt-0.5">
                            Activación guiada de «{cleanPhrase}»
                          </h3>
                          <p className="text-xs sm:text-sm text-slate-600 mt-1 leading-relaxed">
                            Cierra los ojos por unos segundos y sigue la voz serena del guía para disparar y verificar tu ancla en <span className="font-medium text-slate-800">{selectedPointObj.label.toLowerCase()}</span>.
                          </p>
                        </div>

                        <div className="flex flex-wrap items-center gap-2.5">
                          <button type="button" onClick={handleToggleVoiceGuide} className="min-h-[44px] px-5 py-2.5 rounded-xl bg-[#991B1B] hover:bg-[#7F1D1D] text-white text-sm font-medium inline-flex items-center gap-2 cursor-pointer whitespace-nowrap">
                            {isVoicePlaying ? (<><IconPause /><span>Detener Guía</span></>) : (<><IconPlay /><span>Escuchar Guía Auditiva</span></>)}
                          </button>
                          <button type="button" onClick={() => setShowScript((s) => !s)} className="min-h-[44px] px-3 py-2 rounded-xl text-xs font-medium text-slate-600 hover:text-slate-900 hover:bg-white/80 cursor-pointer">
                            {showScript ? 'Ocultar guion' : 'Ver guion'}
                          </button>
                        </div>

                        {voiceError && <p className="text-xs text-red-700">{voiceError}</p>}
                        {showScript && (
                          <p className="p-4 rounded-xl bg-white/95 border border-amber-200/70 text-xs sm:text-sm text-slate-700 leading-relaxed">
                            &ldquo;{mexicanScript}&rdquo;
                          </p>
                        )}
                      </div>

                      <div className="p-6 rounded-2xl bg-white border border-amber-200/60 space-y-4">
                        <div className="space-y-1">
                          <p className="text-sm font-semibold text-slate-900">Registra la intensidad percibida de tu ancla</p>
                          <p className="text-xs text-slate-600">Califica del 1 al 10 qué tan vívida sentiste tu energía al probar el contacto físico.</p>
                        </div>
                        <div className="flex items-center justify-between gap-4">
                          <input type="range" min={1} max={10} value={intensity} onChange={(e) => setIntensity(Number(e.target.value))} className="w-full accent-[#D97706] cursor-pointer" />
                          <span className="font-mono text-lg font-semibold tabular-nums text-[#D97706] min-w-[3ch] text-right">{intensity}/10</span>
                        </div>
                        <div className="flex flex-col sm:flex-row gap-2.5 pt-1">
                          {!logSaved ? (
                            <button type="button" onClick={handleSaveSession} className="flex-1 min-h-[44px] px-4 py-2.5 rounded-xl bg-[#D97706] hover:bg-[#B45309] text-white text-sm font-medium cursor-pointer">
                              Guardar Sesión en Bitácora
                            </button>
                          ) : (
                            <button type="button" onClick={onOpenBitacora} className="flex-1 min-h-[44px] px-4 py-2.5 rounded-xl bg-[#15803D] hover:bg-[#166534] text-white text-sm font-medium cursor-pointer">
                              Ver Mi Bitácora Completa
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  <div className="flex flex-wrap items-center justify-center gap-3 pt-1">
                    <button type="button" onClick={handleStartOrToggle} className="min-h-[48px] px-7 py-3 rounded-xl bg-[#991B1B] hover:bg-[#7F1D1D] text-white font-medium text-sm inline-flex items-center gap-2 shadow-sm cursor-pointer whitespace-nowrap">
                      {isRunning ? (<><IconPause /><span>Pausar Guía</span></>) : isCompleted ? (<><IconRotateCcw /><span>Repetir Anclaje</span></>) : elapsedSec > 0 ? (<><IconPlay /><span>Continuar</span></>) : (<><IconPlay /><span>Iniciar Anclaje</span></>)}
                    </button>
                    {!isCompleted && !isRunning && elapsedSec === 0 && (
                      <button type="button" onClick={handleJumpToReadyAnchor} className="min-h-[48px] px-4 py-3 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-300/70 text-[#92400E] font-medium text-sm inline-flex items-center gap-2 cursor-pointer whitespace-nowrap">
                        <span>Ir a Ancla Lista</span>
                      </button>
                    )}
                    {elapsedSec > 0 && !isCompleted && (
                      <button type="button" onClick={handleReset} aria-label="Reiniciar temporizador" className="min-h-[48px] min-w-[48px] px-3 py-3 rounded-xl bg-white hover:bg-amber-50 border border-amber-200/80 text-slate-600 inline-flex items-center justify-center cursor-pointer">
                        <IconRotateCcw />
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          </section>
        );
      };

      /* ---------- Bitácora Summary Modal ---------- */
      const BitacoraModal = ({ isOpen, onClose, state, totalPurgeTasks, onResetAll }) => {
        const [copied, setCopied] = useState(false);
        const [confirmReset, setConfirmReset] = useState(false);
        if (!isOpen) return null;

        const purgePct = totalPurgeTasks > 0 ? Math.round((state.completedTaskIds.length / totalPurgeTasks) * 100) : 0;
        const anchorPointLabel = (ANCHOR_POINTS.find((p) => p.id === state.anchorPoint) || ANCHOR_POINTS[0]).label;

        const handleCopySummary = async () => {
          const standardsText = state.nonNegotiables
            .map((n, i) => `${i + 1}. [${n.pillar}] ${n.statement.trim() || 'Pendiente de definir'}`)
            .join('\n');
          const summary = [
            'BITÁCORA DEL NUEVO CICLO — EL UMBRAL DEL RENACER (Carlos Luna PNL)',
            `Purga Física y Digital: ${state.completedTaskIds.length}/${totalPurgeTasks} (${purgePct}%)`,
            '',
            'MIS 3 ESTÁNDARES INQUEBRANTABLES:',
            standardsText,
            '',
            `ANCLA DE PODER PNL: ${anchorPointLabel} · "${state.anchorPhrase}"`,
            `Sesiones ancladas: ${state.anchorLogs.length}`,
          ].join('\n');
          try {
            await navigator.clipboard.writeText(summary);
            setCopied(true);
            setTimeout(() => setCopied(false), 2500);
          } catch (e) {}
        };

        return (
          <div role="dialog" aria-modal="true" aria-labelledby="bitacora-title" className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-red-950/65 backdrop-blur-sm p-0 sm:p-4">
            <div className="w-full max-w-2xl bg-[#FFFDF9] text-slate-900 rounded-t-3xl sm:rounded-3xl border border-amber-200/70 shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
              <div className="flex items-center justify-between px-6 py-4 border-b border-amber-200/60 bg-[#991B1B] text-[#FFFDF9]">
                <div>
                  <p className="text-xs text-amber-200">El Umbral del Renacer</p>
                  <h2 id="bitacora-title" className="font-editorial text-2xl font-semibold text-[#FFFDF9]">Mi Bitácora del Nuevo Ciclo</h2>
                </div>
                <button type="button" onClick={onClose} aria-label="Cerrar bitácora" className="min-w-[44px] min-h-[44px] rounded-xl flex items-center justify-center text-red-100 hover:text-white hover:bg-white/10 cursor-pointer">
                  <IconX />
                </button>
              </div>

              <div className="p-6 space-y-6 overflow-y-auto">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="p-4 rounded-2xl bg-white border border-amber-200/60">
                    <p className="text-xs text-slate-500">Purga Completada</p>
                    <p className="font-mono text-2xl font-semibold tabular-nums text-[#15803D] mt-1">{purgePct}%</p>
                  </div>
                  <div className="p-4 rounded-2xl bg-white border border-amber-200/60">
                    <p className="text-xs text-slate-500">Estándares Sellados</p>
                    <p className="font-mono text-2xl font-semibold tabular-nums text-[#D97706] mt-1">{state.nonNegotiables.filter((n) => n.sealed).length}/3</p>
                  </div>
                  <div className="p-4 rounded-2xl bg-white border border-amber-200/60">
                    <p className="text-xs text-slate-500">Anclas Instaladas</p>
                    <p className="font-mono text-2xl font-semibold tabular-nums text-[#991B1B] mt-1">{state.anchorLogs.length}</p>
                  </div>
                </div>

                <div className="p-5 rounded-2xl bg-white border border-amber-200/60 space-y-3">
                  <h3 className="font-editorial text-xl font-semibold text-slate-900">Tus 3 Estándares Inquebrantables</h3>
                  <ul className="divide-y divide-slate-100">
                    {state.nonNegotiables.map((item, idx) => (
                      <li key={item.id} className="py-3 first:pt-1 last:pb-1 space-y-1">
                        <div className="flex items-center justify-between text-xs text-slate-500">
                          <span>0{idx + 1} · {item.pillar}</span>
                          <span className={item.sealed ? 'text-[#D97706] font-medium' : ''}>{item.sealed ? 'Sellado' : 'Borrador'}</span>
                        </div>
                        <p className="text-sm text-slate-800">{item.statement.trim() || 'Aún sin redactar en la pantalla 03.'}</p>
                      </li>
                    ))}
                  </ul>
                </div>

                <div className="p-5 rounded-2xl bg-white border border-amber-200/60 space-y-2">
                  <h3 className="font-editorial text-xl font-semibold text-slate-900">Ancla de Poder PNL</h3>
                  <p className="text-sm text-slate-700">
                    <span className="font-medium text-slate-900">Punto físico:</span> {anchorPointLabel}
                    <span aria-hidden="true"> · </span>
                    <span className="font-medium text-slate-900">Frase:</span> &ldquo;{state.anchorPhrase || 'Presencia Inquebrantable'}&rdquo;
                  </p>
                  {state.anchorLogs.length > 0 && (
                    <p className="text-xs text-slate-500 pt-1">
                      Última intensidad registrada: <span className="font-mono font-medium tabular-nums text-[#D97706]">{state.anchorLogs[state.anchorLogs.length - 1].intensity}/10</span> ({state.anchorLogs[state.anchorLogs.length - 1].completedAt})
                    </p>
                  )}
                </div>
              </div>

              <div className="px-6 py-4 border-t border-amber-200/60 bg-white flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <button type="button" onClick={handleCopySummary} className="min-h-[44px] px-4 py-2 rounded-xl bg-[#991B1B] hover:bg-[#7F1D1D] text-white text-sm font-medium inline-flex items-center justify-center gap-2 cursor-pointer">
                  {copied ? (<><IconCheck /><span>Resumen copiado</span></>) : (<><IconCopy /><span>Copiar Bitácora</span></>)}
                </button>
                {!confirmReset ? (
                  <button type="button" onClick={() => setConfirmReset(true)} className="min-h-[44px] px-3 py-2 rounded-xl text-xs font-medium text-slate-500 hover:text-red-700 hover:bg-red-50 inline-flex items-center gap-1.5 cursor-pointer">
                    <IconRotateCcw className="w-3.5 h-3.5" />
                    <span>Reiniciar todo</span>
                  </button>
                ) : (
                  <div className="flex items-center gap-2 text-xs">
                    <button type="button" onClick={() => { onResetAll(); setConfirmReset(false); }} className="min-h-[38px] px-3 py-1.5 rounded-lg bg-[#991B1B] text-white font-medium hover:bg-[#7F1D1D] cursor-pointer">Confirmar reinicio</button>
                    <button type="button" onClick={() => setConfirmReset(false)} className="min-h-[38px] px-3 py-1.5 rounded-lg bg-slate-100 text-slate-700 font-medium cursor-pointer">Cancelar</button>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      /* ---------- Main Application ---------- */
      function App() {
        const [activeScreen, setActiveScreen] = useState(1);
        const [purgeFilter, setPurgeFilter] = useState('all');
        const [isBitacoraOpen, setIsBitacoraOpen] = useState(false);
        const [ritualState, setRitualState] = useState(() => {
          try {
            const raw = window.localStorage.getItem(STORAGE_KEY);
            if (!raw) return DEFAULT_STATE;
            const parsed = JSON.parse(raw);
            return {
              ...DEFAULT_STATE,
              ...parsed,
              nonNegotiables: Array.isArray(parsed.nonNegotiables) && parsed.nonNegotiables.length === 3 ? parsed.nonNegotiables : DEFAULT_STATE.nonNegotiables,
              completedTaskIds: Array.isArray(parsed.completedTaskIds) ? parsed.completedTaskIds : [],
              customTasks: Array.isArray(parsed.customTasks) ? parsed.customTasks : [],
              anchorLogs: Array.isArray(parsed.anchorLogs) ? parsed.anchorLogs : [],
            };
          } catch (e) {
            return DEFAULT_STATE;
          }
        });

        useEffect(() => {
          try {
            window.localStorage.setItem(STORAGE_KEY, JSON.stringify(ritualState));
          } catch (e) {}
        }, [ritualState]);

        const allPurgeTasks = useMemo(
          () => [...INITIAL_PURGE_TASKS, ...ritualState.customTasks],
          [ritualState.customTasks]
        );

        const handleNavigate = (screen, recommendedCategory) => {
          if (screen === 2 && recommendedCategory) setPurgeFilter(recommendedCategory);
          setActiveScreen(screen);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleToggleTask = (taskId) => {
          setRitualState((prev) => ({
            ...prev,
            completedTaskIds: prev.completedTaskIds.includes(taskId)
              ? prev.completedTaskIds.filter((id) => id !== taskId)
              : [...prev.completedTaskIds, taskId],
          }));
        };

        const handleAddCustomTask = (category, title, detail) => {
          const newTask = {
            id: `custom-${Date.now()}`,
            category,
            title,
            detail,
            pnlReason: 'Compromiso específico elegido por ti para cerrar un frente abierto y recuperar claridad visual.',
            isCustom: true,
          };
          setRitualState((prev) => ({ ...prev, customTasks: [...prev.customTasks, newTask] }));
        };

        const handleDeleteCustomTask = (taskId) => {
          setRitualState((prev) => ({
            ...prev,
            customTasks: prev.customTasks.filter((t) => t.id !== taskId),
            completedTaskIds: prev.completedTaskIds.filter((id) => id !== taskId),
          }));
        };

        const handleUpdateNonNegotiable = (id, patch) => {
          setRitualState((prev) => ({
            ...prev,
            nonNegotiables: prev.nonNegotiables.map((item) => (item.id === id ? { ...item, ...patch } : item)),
          }));
        };

        const navItems = [
          { id: 1, label: '01. Vacío Fértil', mobileLabel: 'Vacío', Icon: IconCompass },
          { id: 2, label: '02. Purga', mobileLabel: 'Purga', Icon: IconCheckSquare },
          { id: 3, label: '03. Estándares', mobileLabel: 'Estándares', Icon: IconShield },
          { id: 4, label: '04. Ancla PNL', mobileLabel: 'Ancla', Icon: IconAnchor },
        ];

        return (
          <div className="min-h-screen flex flex-col bg-gradient-to-b from-[#991B1B] via-[#8B1520] to-[#7F1D1D] text-[#FFFDF9] pb-20 md:pb-0">
            <header className="sticky top-0 z-30 h-14 bg-[#7F1D1D]/90 backdrop-blur-md border-b border-amber-200/20">
              <div className="max-w-6xl mx-auto h-full px-4 sm:px-6 flex items-center justify-between gap-8">
                <button type="button" onClick={() => handleNavigate(1)} className="font-editorial text-xl font-semibold tracking-tight text-[#FFFDF9] whitespace-nowrap shrink-0 cursor-pointer">
                  El Umbral del Renacer
                </button>
                <nav aria-label="Etapas del ritual" className="hidden md:flex items-center gap-6 text-sm font-medium">
                  {navItems.map((item) => (
                    <button
                      key={item.id}
                      type="button"
                      onClick={() => handleNavigate(item.id)}
                      className={`py-1 transition-colors whitespace-nowrap shrink-0 cursor-pointer border-b-2 ${activeScreen === item.id ? 'text-[#FDE68A] border-[#FBBF24]' : 'text-red-100/85 border-transparent hover:text-white'}`}
                    >
                      {item.label}
                    </button>
                  ))}
                </nav>
                <div className="flex items-center shrink-0">
                  <button type="button" onClick={() => setIsBitacoraOpen(true)} className="min-h-[38px] px-4 py-1.5 rounded-lg bg-[#FFFDF9] hover:bg-amber-50 text-[#7F1D1D] text-xs font-semibold inline-flex items-center gap-1.5 whitespace-nowrap shrink-0 cursor-pointer">
                    <IconBook />
                    <span>Mi Bitácora</span>
                  </button>
                </div>
              </div>
            </header>

            <main className="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
              {activeScreen === 1 && (
                <ScreenVacioFertil
                  saturationFocus={ritualState.saturationFocus}
                  onSelectSaturation={(focus) => setRitualState((prev) => ({ ...prev, saturationFocus: focus }))}
                  onNavigate={handleNavigate}
                  completedPurgeCount={ritualState.completedTaskIds.length}
                  totalPurgeCount={allPurgeTasks.length}
                />
              )}
              {activeScreen === 2 && (
                <ScreenPurgaChecklist
                  tasks={allPurgeTasks}
                  completedTaskIds={ritualState.completedTaskIds}
                  activeFilter={purgeFilter}
                  onChangeFilter={setPurgeFilter}
                  onToggleTask={handleToggleTask}
                  onAddCustomTask={handleAddCustomTask}
                  onDeleteCustomTask={handleDeleteCustomTask}
                  onResetCompleted={() => setRitualState((prev) => ({ ...prev, completedTaskIds: [] }))}
                  onNavigate={handleNavigate}
                />
              )}
              {activeScreen === 3 && (
                <ScreenNonNegotiables
                  items={ritualState.nonNegotiables}
                  onUpdateItem={handleUpdateNonNegotiable}
                  onNavigate={handleNavigate}
                />
              )}
              {activeScreen === 4 && (
                <ScreenAnclaPNL
                  anchorPoint={ritualState.anchorPoint}
                  anchorPhrase={ritualState.anchorPhrase}
                  anchorDuration={ritualState.anchorDuration}
                  anchorLogs={ritualState.anchorLogs}
                  onChangePoint={(point) => setRitualState((prev) => ({ ...prev, anchorPoint: point }))}
                  onChangePhrase={(phrase) => setRitualState((prev) => ({ ...prev, anchorPhrase: phrase }))}
                  onChangeDuration={(duration) => setRitualState((prev) => ({ ...prev, anchorDuration: duration }))}
                  onLogCompletion={(log) => setRitualState((prev) => ({ ...prev, anchorLogs: [...prev.anchorLogs, log] }))}
                  onOpenBitacora={() => setIsBitacoraOpen(true)}
                />
              )}
            </main>

            <footer className="border-t border-amber-200/20 bg-[#7F1D1D]/70">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-red-100/85">
                <p>Basado en el e-book &ldquo;El Umbral del Renacer&rdquo; de Carlos Luna PNL.</p>
                <p className="text-[#FDE68A]">Aplicación interactiva autocontenida · Ancla de Poder y Nuevo Ciclo</p>
              </div>
            </footer>

            <nav aria-label="Navegación móvil" className="md:hidden fixed bottom-0 left-0 right-0 z-40 h-16 bg-[#7F1D1D]/95 backdrop-blur-md border-t border-amber-200/20 grid grid-cols-4 items-center px-1">
              {navItems.map((item) => {
                const active = activeScreen === item.id;
                const Icon = item.Icon;
                return (
                  <button key={item.id} type="button" onClick={() => handleNavigate(item.id)} className={`min-h-[48px] flex flex-col items-center justify-center gap-1 rounded-xl cursor-pointer ${active ? 'text-[#FDE68A]' : 'text-red-100/75 hover:text-white'}`}>
                    <Icon className="w-5 h-5" />
                    <span className="text-[11px] font-medium tracking-tight leading-none">{item.mobileLabel}</span>
                  </button>
                );
              })}
            </nav>

            <BitacoraModal
              isOpen={isBitacoraOpen}
              onClose={() => setIsBitacoraOpen(false)}
              state={ritualState}
              totalPurgeTasks={allPurgeTasks.length}
              onResetAll={() => {
                setRitualState(DEFAULT_STATE);
                setPurgeFilter('all');
                setActiveScreen(1);
                setIsBitacoraOpen(false);
              }}
            />
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
